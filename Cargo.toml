[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rustle-animation = { path = "crates/rustle-animation" }
rustle-charts = { path = "crates/rustle-charts" }
rustle-foundation = { path = "crates/rustle-foundation" }
rustle-geometry = { path = "crates/rustle-geometry" }
rustle-graphics = { path = "crates/rustle-graphics" }
rustle-icons = { path = "crates/rustle-icons" }
rustle-icons-macros = { path = "crates/rustle-icons-macros" }
rustle-macros = { path = "crates/rustle-macros" }
rustle-navigation = { path = "crates/rustle-navigation" }
rustle-runtime = { path = "crates/rustle-runtime" }
rustle-shaders = { path = "crates/rustle-shaders" }
rustle-text = { path = "crates/rustle-text" }
rustle-ui = { path = "crates/rustle-ui" }
rustle-unit = { path = "crates/rustle-unit" }
rustle-wgpu = { path = "crates/rustle-wgpu" }
rustle-widgets = { path = "crates/rustle-widgets" }
