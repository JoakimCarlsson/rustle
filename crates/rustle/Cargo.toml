[package]
name = "rustle"
description = "A tiny declarative UI framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
accesskit = "0.25"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
rustle-animation.workspace = true
rustle-charts.workspace = true
rustle-foundation.workspace = true
rustle-geometry.workspace = true
rustle-graphics.workspace = true
rustle-icons.workspace = true
rustle-macros.workspace = true
rustle-navigation.workspace = true
rustle-runtime.workspace = true
rustle-text.workspace = true
rustle-ui.workspace = true
rustle-unit.workspace = true
rustle-wgpu.workspace = true
rustle-widgets.workspace = true
wgpu = "30.0.1"
winit = "0.31.0-beta.4"

# The example lives at the workspace root, outside any package, so it is
# registered here; run it with `cargo run --release --example hello_world`.
# `advance` is the showpiece: shaders-style canvases, live charts and motion.
[[example]]
name = "hello_world"
path = "../../examples/hello_world/main.rs"

[[example]]
name = "advance"
path = "../../examples/advance/main.rs"

# Times a frame of a few thousand nodes with an animating value.
[[example]]
name = "bench"
path = "../../examples/bench/main.rs"

[[example]]
name = "multi_window"
path = "../../examples/multi_window/main.rs"

# Rich text spans, wrapped text areas, glyph-level layout and selection across blocks.
[[example]]
name = "text"
path = "../../examples/text/main.rs"

# Rounded clips, a pinned chat list and scrollbars.
[[example]]
name = "graphics"
path = "../../examples/graphics/main.rs"

# An interface inside a host that owns the GPU device, checked headless.
[[example]]
name = "embedded"
path = "../../examples/embedded/main.rs"

# The theme as Compose's MaterialTheme has it: a scheme made from a seed color, typography,
# shapes, tonal elevation and ripples.
[[example]]
name = "theme"
path = "../../examples/theme/main.rs"

[features]
# More Phosphor weights; the regular weight is always there.
icons-thin = ["rustle-icons/thin"]
icons-light = ["rustle-icons/light"]
icons-bold = ["rustle-icons/bold"]
icons-fill = ["rustle-icons/fill"]

[dev-dependencies]
pollster = "1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.24.1"
rustix = { version = "1.1.5", features = ["fs"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
x11rb = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.35.2"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27.2"
