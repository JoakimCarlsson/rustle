[package]
name = "rustle-wgpu"
description = "wgpu rendering backend for Rustle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12.0"
pollster = "1.0.1"
