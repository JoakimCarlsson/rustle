[package]
name = "rustle-wgpu"
description = "wgpu rendering backend for Rustle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
foldhash = "0.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12.0"
rustle-geometry.workspace = true
rustle-graphics.workspace = true
rustle-text.workspace = true
rustle-shaders.workspace = true
wgpu = "30.0.1"
zeno = { version = "0.3.3", default-features = false, features = ["std"] }
cosmic-text = { version = "0.19", default-features = false, features = ["shape-run-cache"] }
etagere = "0.3.0"
